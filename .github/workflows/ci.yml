name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate data, code, tests, and Pages export
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Check out the proposed change without stored credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22.23.1"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Validate data, lint, build, and run tests
        run: npm run check

      - name: Audit high-severity dependency findings
        # Scope to production dependencies: only these ship in the exported
        # static site. Dev-only tooling advisories (e.g. the eslint/minimatch
        # brace-expansion chain) are not part of the deployed artifact.
        run: npm audit --omit=dev --audit-level=high

      - name: Verify npm registry signatures
        run: npm audit signatures
